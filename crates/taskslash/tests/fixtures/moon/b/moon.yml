# `typecheck` fails, so `lint`, which depends on it, is skipped. `test` writes a line to stdout
# and one to stderr, which its log holds.
tasks:
  test:
    script: "echo b-test-out; echo b-test-err >&2"
  typecheck:
    command: "false"
  lint:
    command: "true"
    deps: ["b:typecheck"]
  # A bare package binary, as the gate's tsc and oxlint are: found only on the workspace's
  # node_modules/.bin, which the test puts there.
  bare:
    command: "fixture-tool"
  # Passes only when the repository's moon wrapper (scripts/moon.ts, which the test writes) ran it.
  wrapped:
    script: 'test "$FIXTURE_WRAPPED" = yes'
